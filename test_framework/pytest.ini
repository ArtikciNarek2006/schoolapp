[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --timeout=30
markers =
    auth: Authentication tests
    realms: Realm management tests
    users: User management tests
    timetable: Timetable tests
    attendance: Attendance tests
    groups: Group management tests
    messages: Message / chat tests
    socket: Socket.io integration tests
log_cli = true
log_cli_level = WARNING
