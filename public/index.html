<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#4f46e5" />
  <title>SchoolApp</title>
  <link rel="stylesheet" href="/css/app.css?v=9" />
</head>
<body>

  <!-- ── Toast notifications ──────────────────────────────────────────── -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- ── Full-screen overlay (modals) ─────────────────────────────────── -->
  <div id="overlay" class="overlay hidden">
    <div id="modal" class="modal"></div>
  </div>

  <!-- ── Top app bar ───────────────────────────────────────────────────── -->
  <header id="app-bar" class="app-bar hidden">
    <button id="btn-back" class="icon-btn hidden" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <span id="app-bar-title" class="app-bar-title">SchoolApp</span>
    <div class="bar-actions">
      <button id="btn-theme" class="icon-btn" aria-label="Toggle theme" title="Toggle dark mode">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button id="btn-bar-action" class="icon-btn hidden" aria-label="Action"></button>
    </div>
  </header>

  <!-- ── Main content ──────────────────────────────────────────────────── -->
  <main id="view-root" class="view-root"></main>

  <!-- ── Bottom navigation ─────────────────────────────────────────────── -->
  <nav id="bottom-nav" class="bottom-nav hidden" role="navigation" aria-label="Main">
    <button class="nav-item" data-view="dashboard" aria-label="Dashboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
      <span>Dashboard</span>
    </button>
    <button class="nav-item" data-view="chat" aria-label="Chat">
      <span class="nav-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="badge hidden" id="chat-badge"></span>
      </span>
      <span>Chat</span>
    </button>
    <button class="nav-item" data-view="notices" aria-label="Notices">
      <span class="nav-icon-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="badge hidden" id="notice-badge"></span>
      </span>
      <span>Notices</span>
    </button>
    <button class="nav-item" data-view="timetable" aria-label="Timetable">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Timetable</span>
    </button>
    <button class="nav-item" data-view="admin" aria-label="Admin" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a5 5 0 1 0 0 10A5 5 0 0 0 12 2z"/><path d="M12 14c-5.33 0-8 2.67-8 4v1h16v-1c0-1.33-2.67-4-8-4z"/><polyline points="16 11 18 13 22 9"/></svg>
      <span>Admin</span>
    </button>
    <button class="nav-item" data-view="profile" aria-label="Profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span>Profile</span>
    </button>
  </nav>

  <!-- ── Scripts ───────────────────────────────────────────────────────── -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js?v=8"></script>
  <script src="/js/socket.js?v=8"></script>
  <script src="/js/router.js?v=8"></script>
  <script src="/js/views/login.js?v=8"></script>
  <script src="/js/views/dashboard.js?v=8"></script>
  <script src="/js/views/chat.js?v=8"></script>
  <script src="/js/views/notices.js?v=8"></script>
  <script src="/js/views/timetable.js?v=8"></script>
  <script src="/js/views/admin.js?v=8"></script>
  <script src="/js/views/profile.js?v=8"></script>
  <script src="/js/app.js?v=8"></script>

</body>
</html>
